name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Release
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Cache Homebrew
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: brew-

      - name: Install dependencies
        run: brew install xcodegen

      - name: Generate Xcode project
        run: make project

      - name: Build release
        run: make dist VERSION=${GITHUB_REF_NAME#v}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/SpectraWall-*.zip

      - name: Update Homebrew Cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SHA=$(shasum -a 256 dist/SpectraWall-${VERSION}.zip | awk '{print $1}')

          git clone https://x-access-token:${TAP_TOKEN}@github.com/giggs-lynx/homebrew-tap.git
          cd homebrew-tap

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/spectrawall.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA}\"/" Casks/spectrawall.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/spectrawall.rb
          git commit -m "chore: bump spectrawall to ${VERSION}"
          git push
