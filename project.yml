name: SpectraWall
options:
  bundleIdPrefix: com.spectrawall
  deploymentTarget:
    macOS: "14.2"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  fileTypes:
    metal:
      buildPhase: sources
    ogl:
      buildPhase: sources

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  SpectraWall:
    type: application
    platform: macOS
    sources:
      - path: SpectraWall
        type: group
    settings:
      base:
        INFOPLIST_FILE: SpectraWall/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spectrawall.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        REGISTER_APP_GROUPS: YES
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
        DEAD_CODE_STRIPPING: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          STRING_CATALOG_GENERATE_SYMBOLS: YES
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          STRING_CATALOG_GENERATE_SYMBOLS: YES
          DEAD_CODE_STRIPPING: YES

  SpectraWallTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SpectraWallTests
        type: group
    dependencies:
      - target: SpectraWall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spectrawall.appTests
        PRODUCT_NAME: SpectraWallTests
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SpectraWall.app/Contents/MacOS/SpectraWall"
        BUNDLE_LOADER: "$(TEST_HOST)"
        DEAD_CODE_STRIPPING: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          STRING_CATALOG_GENERATE_SYMBOLS: YES
        Release:
          DEAD_CODE_STRIPPING: YES

  SpectraWallUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: SpectraWallUITests
        type: group
    dependencies:
      - target: SpectraWall
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.spectrawall.appUITests
        PRODUCT_NAME: SpectraWallUITests
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TEST_TARGET_NAME: SpectraWall
        DEAD_CODE_STRIPPING: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          STRING_CATALOG_GENERATE_SYMBOLS: YES
        Release:
          DEAD_CODE_STRIPPING: YES
